name: quality-gates

on:
  pull_request:
  push:
    branches: [ main, work ]
  workflow_dispatch: {}   # manual "Run workflow" button — use this to test any branch

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Hindi guard (आप not तुम)
        run: npm run check:hindi

      - name: Pancham Kaal doctrinal guard
        run: npm run check:pancham

      - name: Karma quality guard
        run: npm run check:karma

      - name: PDF parity guard
        run: npm run check:pdfparity

      - name: Production build
        run: npm run build

      # Downloadable production bundle — lets you verify a real build without
      # any local Node installation.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Compact pass/fail summary visible on the Actions run page.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Quality gates — ${{ job.status }}"
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Type-check (tsc) | ✅ |"
            echo "| Hindi guard | ✅ |"
            echo "| Pancham Kaal guard | ✅ |"
            echo "| Karma quality guard | ✅ |"
            echo "| PDF parity guard | ✅ |"
            echo "| Build (vite) | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
